</head>

      <div class="brand-title">
        <span>Antigravity</span>
      </div>
    </div>

    <div class="header-right">
      <div id="login-area"></div>
      <button id="btn-theme" class="btn btn-ghost btn-icon" title="切换主题">
        <i data-lucide="sun" id="theme-icon" style="width: 17px; height: 17px;"></i>
      </button>
      <button id="btn-about" class="btn btn-ghost btn-icon" title="设置与关于">
        <i data-lucide="settings" style="width: 17px; height: 17px;"></i>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="btn-new" class="new-chat-btn">
          <span style="display: flex; align-items: center; gap: 7px;">
            <i data-lucide="plus" style="width: 15px; height: 15px;"></i>
            <span>新建对话</span>
          </span>
          <kbd class="shortcut-kbd">Ctrl+K</kbd>
        </button>
        <div class="search-input-wrap" id="search-wrap">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="session-search" class="search-input" placeholder="搜索历史会话..." autocomplete="off" spellcheck="false" />
          <div class="search-trailing">
            <button id="btn-clear-search" class="search-clear-btn" title="清空搜索 (Esc)" style="display: none;">
              <i data-lucide="x" style="width: 12px; height: 12px;"></i>
            </button>
            <kbd class="search-kbd-hint" id="search-kbd-hint">Ctrl+F</kbd>
          </div>
        </div>
        <div id="search-stats" class="search-stats" style="display: none;">
          <span id="search-count-text">共 0 条匹配</span>
          <button id="btn-cancel-search" class="search-cancel-link">清空</button>
        </div>
      </div>

      <div id="conv-list" class="sidebar-list"></div>

      <div class="sidebar-footer">
        <div id="sidebar-user-card" class="sidebar-user-card" style="display:none;"></div>

        <div class="sidebar-toggle-row" id="toggle-thinking-row" title="开启后在聊天中显示深度思考过程与工具调用详情">
          <div class="sidebar-toggle-label">
            <i data-lucide="brain-circuit" style="width: 15px; height: 15px;"></i>
            <span>显示思考与工具</span>
          </div>
          <label class="toggle-switch" onclick="event.stopPropagation()">
            <input type="checkbox" id="toggle-thinking" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <button id="btn-export" class="sidebar-nav-btn" title="导出当前对话为 Markdown">
          <i data-lucide="download" style="width: 15px; height: 15px;"></i>
          <span>导出对话 (.md)</span>
        </button>

        <button id="btn-files" class="sidebar-nav-btn" title="文件管理">
          <i data-lucide="folder-tree" style="width: 15px; height: 15px;"></i>
          <span>文件</span>
        </button>
        <button id="btn-plugins" class="sidebar-nav-btn">
          <i data-lucide="blocks" style="width: 15px; height: 15px;"></i>
          <span>插件中心</span>
        </button>
        <button id="btn-web-logout" class="sidebar-nav-btn" title="退出 Web 访问登录" onclick="handleWebLogout()">
          <i data-lucide="log-out" style="width: 15px; height: 15px; color: var(--danger);"></i>
          <span style="color: var(--danger);">退出管理登录</span>
        </button>
      </div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

    <!-- Main Chat Content -->
    <main class="main-chat">
      <!-- Empty State -->
      <div id="chat-empty" class="chat-empty">
        <div class="empty-icon">◇</div>
        <h1 class="empty-title">Google Antigravity</h1>
        <p id="empty-hint" class="empty-subtitle">选择模型与思考强度，开始全新的 AI 编程协作</p>
        
        <div class="starter-grid">
          <div class="starter-card" data-prompt="帮我查看当前系统的环境配置与正在运行的服务">
            <strong>🖥️ 系统环境排查</strong>
            <span>检查 CPU、内存、Docker 与运行状态</span>
          </div>
          <div class="starter-card" data-prompt="写一个 Node.js Express 快速启动的 RESTful API 示例">
            <strong>⚡ 快速构建 API</strong>
            <span>创建现代后端 REST 路由与中间件</span>
          </div>
          <div class="starter-card" data-prompt="如何使用 Antigravity CLI 进行代码重构与自动化测试？">
            <strong>🛠️ CLI 使用指南</strong>
            <span>学习 TaskMaster、沙箱与自动化命令</span>
          </div>
          <div class="starter-card" data-prompt="请设计一个微服务架构方案并给出流程图说明">
            <strong>💡 架构设计</strong>
            <span>系统解耦、高可用与数据库设计方案</span>
          </div>
        </div>
      </div>

      <!-- Active Chat Feed -->
      <div id="chat-feed" class="chat-feed hidden"></div>

      <!-- Quick Scroll to Bottom Floating Button -->
      <button id="btn-scroll-bottom" class="scroll-bottom-btn hidden" title="快速回到底部">
        <i data-lucide="arrow-down" style="width: 17px; height: 17px;"></i>
      </button>

      <!-- Composer / Input Box -->
      <div class="composer-wrap">
        <div class="composer-box">
          <!-- Controls Bar (Compact) -->
          <div class="composer-controls">
            <div class="pill-select-wrap" title="选择模型">
              <i data-lucide="cpu" style="width: 12px; height: 12px; color: var(--accent);"></i>
              <select id="model-select"></select>
            </div>

            <div class="pill-select-wrap" id="effort-wrap" title="思考强度 (Deep Thinking)">
              <i data-lucide="sparkles" style="width: 12px; height: 12px; color: #f59e0b;"></i>
              <select id="effort">
                <option value="high" selected>思考: 高</option>
                <option value="medium">思考: 中</option>
                <option value="low">思考: 低</option>
                <option value="off">思考: 关</option>
              </select>
            </div>

            <div class="pill-select-wrap" title="CLI 命令执行权限策略">
              <i data-lucide="shield-check" style="width: 12px; height: 12px; color: #10b981;"></i>
              <select id="permissions">
                <option value="approve" selected>🟢 自动批准</option>
                <option value="ask">🟡 询问模式</option>
              </select>
            </div>
          </div>

          <!-- Attachment Preview Row -->
          <div id="attachment-preview" class="attachment-preview hidden"></div>

          <!-- Input Row -->
          <div class="composer-input-row">
            <textarea id="input" class="composer-textarea" rows="1" placeholder="向 Antigravity 发送指令... (Enter 发送, Shift+Enter 换行)" autocomplete="off"></textarea>
            <button id="btn-attach" class="attach-btn" title="添加附件">
              <i data-lucide="paperclip" style="width: 18px; height: 18px;"></i>
            </button>
            <button id="btn-send" class="send-action-btn" title="发送 (Enter)">
              <i data-lucide="arrow-up" id="send-icon" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
          <input type="file" id="file-input" multiple style="display:none" />

          <div id="composer-status" class="hidden"></div>
        </div>
      </div>
    </main>
  </div>

  </div>



  <!-- WebUI Login Gate Overlay (Private Access Control) -->
  <div id="login-gate-overlay" class="login-gate-overlay hidden">
    <div class="login-gate-bg-glow"></div>
    <div class="login-card" id="login-card">
      <div class="login-header">
        <div class="login-brand-badge">
          <svg viewBox="0 0 113 113" height="36" width="36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M89.6992 93.695C94.3659 97.195 101.366 94.8617 94.9492 88.445C75.6992 69.7783 79.7825 18.445 55.8659 18.445C31.9492 18.445 36.0325 69.7783 16.7825 88.445C9.78251 95.445 17.3658 97.195 22.0325 93.695C40.1159 81.445 38.9492 59.8617 55.8659 59.8617C72.7825 59.8617 71.6159 81.445 89.6992 93.695Z" fill="#3186FF"/>
          </svg>
        </div>
        <h2 class="login-title">Google Antigravity</h2>
        <p class="login-subtitle">私有访问控制系统 · 身份鉴权</p>
        <div class="login-security-tag">
          <i data-lucide="shield-check" style="width:13px;height:13px;"></i>
          <span>系统受密码访问保护</span>
        </div>
      </div>

      <form id="login-form" class="login-form" onsubmit="handleWebLogin(event)">
        <div id="login-error-alert" class="login-error-alert" style="display: none;"></div>

        <div class="login-field-group">
          <label for="login-username" class="login-label">管理员账号</label>
          <div class="login-input-wrap">
            <i data-lucide="user" class="login-field-icon"></i>
            <input type="text" id="login-username" class="login-input" placeholder="请输入管理账号 (DJSeven)" autocomplete="username" required autofocus />
          </div>
        </div>

        <div class="login-field-group">
          <label for="login-password" class="login-label">访问密码</label>
          <div class="login-input-wrap">
            <i data-lucide="lock" class="login-field-icon"></i>
            <input type="password" id="login-password" class="login-input" placeholder="请输入访问密码" autocomplete="current-password" required />
            <button type="button" id="btn-toggle-pwd" class="login-pwd-toggle" title="显示/隐藏密码" onclick="togglePasswordVisibility()">
              <i data-lucide="eye" id="icon-pwd-eye" style="width:15px;height:15px;"></i>
            </button>
          </div>
        </div>

        <div class="login-options-row">
          <label class="login-remember-label">
            <input type="checkbox" id="login-remember" checked />
            <span>记住登录凭证</span>
          </label>
        </div>

        <button type="submit" id="btn-submit-login" class="login-submit-btn">
          <span id="login-btn-text">安全登入系统</span>
          <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
        </button>
      </form>

      <div class="login-footer-info">
        <span>Google Antigravity Enterprise Engine v2.0</span>
      </div>
    </div>
  </div>

  <!-- Dynamic Modal Overlay -->
  <div id="modal-root" class="modal-overlay hidden">
    <div class="modal-dialog" id="modal-dialog" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div class="modal-title" id="modal-title"></div>
        <button id="modal-close" class="btn btn-ghost btn-icon">
          <i data-lucide="x" style="width: 16px; height: 16px;"></i>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast-msg hidden"></div>

  <script src="/app.js?v=6.5"></script>
</body>
</html>
